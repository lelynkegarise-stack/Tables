<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo Designated Seats</title>
<style>
  :root {
    --primary-blue: #1b365d;
    --accent-gold: #f4b41a;
    --walkway-bg: #e2e8f0;
    --seat-bg: #eff6ff;
    --seat-border: #2563eb;
    --table-bg: #f8fafc;
  }

  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    background-color: #f1f5f9;
    margin: 0;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Control Bar - Hidden when printing */
  .controls {
    background: white;
    padding: 12px 16px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    margin-bottom: 16px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    max-width: 1200px;
    width: 100%;
  }

  .controls span {
    font-size: 14px;
    color: #334155;
    width: 100%;
    text-align: center;
    margin-bottom: 4px;
  }

  button {
    background-color: var(--primary-blue);
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    transition: background 0.2s;
  }

  button:hover {
    background-color: #2c5282;
  }

  button.secondary {
    background-color: #64748b;
  }

  button.secondary:hover {
    background-color: #475569;
  }

  button.danger {
    background-color: #dc2626;
  }

  button.danger:hover {
    background-color: #b91c1c;
  }

  /* Horizontal scroll wrapper for small phone screens */
  .scroll-wrapper {
    width: 100%;
    max-width: 1200px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }

  /* Main Printable Chart */
  .chart-container {
    background: white;
    min-width: 960px;
    padding: 20px;
    border: 4px solid var(--primary-blue);
    border-radius: 12px;
  }

  .header {
    text-align: center;
    background: var(--primary-blue);
    color: white;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 16px;
  }

  .header h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: 2px;
    color: var(--accent-gold);
  }

  .header p {
    margin: 2px 0 0;
    font-size: 13px;
    letter-spacing: 1px;
    font-weight: bold;
  }

  /* Room Layout with Side Stage & Side Kitchen */
  .room-layout {
    display: grid;
    grid-template-columns: 54px 1fr 76px 1fr 54px;
    gap: 12px;
    align-items: stretch;
  }

  /* Vertical Stage & Kitchen Banners */
  .side-landmark {
    background: #fef3c7;
    border: 3px dashed #d97706;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-weight: 800;
    font-size: 18px;
    color: #92400e;
    letter-spacing: 3px;
    padding: 10px 4px;
    text-align: center;
    cursor: text;
  }

  .side-landmark.kitchen {
    transform: none;
  }

  .tables-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px 10px;
  }

  /* Center Walkway */
  .walkway {
    background: var(--walkway-bg);
    border: 2px solid #94a3b8;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 35px 6px;
    font-weight: 800;
    color: #334155;
    text-align: center;
    font-size: 14px;
    letter-spacing: 1px;
  }

  .arrow {
    font-size: 28px;
    line-height: 1;
  }

  /* Individual Table + Bigger Seats */
  .table-unit {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .seats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }

  .seat {
    background: var(--seat-bg);
    border: 1.5px solid var(--seat-border);
    border-radius: 6px;
    min-height: 46px;
    padding: 4px 3px;
    font-size: 13px;
    font-weight: 600;
    color: #1e3a8a;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.15;
    word-break: break-word;
    cursor: text;
    transition: background 0.15s;
  }

  .seat:hover, .seat:focus {
    background: #fef9c3;
    outline: 2px solid #eab308;
  }

  .seat:empty::before {
    content: "Name";
    color: #93c5fd;
    font-weight: 400;
    font-size: 11px;
  }

  .table-center {
    background: var(--table-bg);
    border: 2.5px solid var(--primary-blue);
    border-radius: 6px;
    padding: 6px 4px;
    text-align: center;
    font-size: 14px;
    font-weight: 800;
    color: var(--primary-blue);
    letter-spacing: 0.5px;
  }

  /* Mobile Phone Adjustments */
  @media (max-width: 768px) {
    body {
      padding: 8px;
    }
    .controls span {
      font-size: 13px;
    }
    button {
      padding: 8px 10px;
      font-size: 12px;
    }
    .seat {
      min-height: 52px;
      font-size: 14px;
    }
  }

  /* Print Formatting */
  @media print {
    body {
      background: white;
      padding: 0;
    }
    .controls {
      display: none !important;
    }
    .scroll-wrapper {
      overflow: visible;
      box-shadow: none;
    }
    .chart-container {
      border: 3px solid var(--primary-blue);
      min-width: 100%;
      padding: 12px;
    }
    .seat:empty::before {
      content: "";
    }
    @page {
      size: landscape;
      margin: 0.35in;
    }
  }
</style>
</head>
<body>

  <!-- Toolbar -->
  <div class="controls">
    <span>✏️ <strong>Tap any seat</strong> to type a person's name. Swipe sideways on phones to view the whole room!</span>
    <button onclick="window.print()">🖨️ Print Chart</button>
    <button class="secondary" onclick="exportData()">💾 Save Backup</button>
    <button class="secondary" onclick="document.getElementById('fileInput').click()">📂 Load Backup</button>
    <button class="danger" onclick="resetChart()">🔄 Clear All Names</button>
    <input type="file" id="fileInput" accept=".json" style="display:none" onchange="importData(event)">
  </div>

  <!-- Scrollable Container for Phones -->
  <div class="scroll-wrapper">
    <div class="chart-container">
      <div class="header">
        <h1>BINGO</h1>
        <p>DESIGNATED SEATS</p>
      </div>

      <div class="room-layout">
        <!-- LEFT WALL: STAGE (Next to Tables 7, 4, 1) -->
        <div class="side-landmark" contenteditable="true" data-id="landmark-stage">🎤 STAGE</div>

        <!-- LEFT TABLES -->
        <div class="tables-grid" id="left-tables"></div>

        <!-- CENTER WALKWAY -->
        <div class="walkway">
          <div class="arrow">↑</div>
          <div>WALK<br>WAY</div>
          <div class="arrow">↓</div>
        </div>

        <!-- RIGHT TABLES -->
        <div class="tables-grid" id="right-tables"></div>

        <!-- RIGHT WALL: KITCHEN (Next to Tables 18, 15, 12) -->
        <div class="side-landmark kitchen" contenteditable="true" data-id="landmark-kitchen">🍽️ KITCHEN</div>
      </div>
    </div>
  </div>

<script>
  // Table layout matching the exact room orientation:
  // Left wall (Stage): 7, 4, 1 on the outside edge
  // Right wall (Kitchen): 18, 15, 12 on the outside edge
  const tableNumbers = {
    left: [
      "Table 7", "Table 8", "Table 9",
      "Table 4", "Table 5", "Table 6",
      "Table 1", "Table 2", "Table 3"
    ],
    right: [
      "Table 16", "Table 17", "Table 18",
      "Table 13", "Table 14", "Table 15",
      "Table 10", "Table 11", "Table 12"
    ]
  };

  function createTableHTML(tableLabel, side, index) {
    const baseId = `${side}-${index}`;
    return `
      <div class="table-unit">
        <div class="seats-row">
          <div class="seat" contenteditable="true" data-id="${baseId}-s1"></div>
          <div class="seat" contenteditable="true" data-id="${baseId}-s2"></div>
          <div class="seat" contenteditable="true" data-id="${baseId}-s3"></div>
        </div>
        <div class="table-center">${tableLabel}</div>
        <div class="seats-row">
          <div class="seat" contenteditable="true" data-id="${baseId}-s4"></div>
          <div class="seat" contenteditable="true" data-id="${baseId}-s5"></div>
          <div class="seat" contenteditable="true" data-id="${baseId}-s6"></div>
        </div>
      </div>
    `;
  }

  function initChart() {
    document.getElementById('left-tables').innerHTML =
      tableNumbers.left.map((label, i) => createTableHTML(label, 'left', i)).join('');

    document.getElementById('right-tables').innerHTML =
      tableNumbers.right.map((label, i) => createTableHTML(label, 'right', i)).join('');

    loadFromStorage();

    document.querySelectorAll('[contenteditable="true"]').forEach(el => {
      el.addEventListener('input', saveToStorage);
    });
  }

  function saveToStorage() {
    const data = {};
    document.querySelectorAll('[contenteditable="true"]').forEach(el => {
      data[el.dataset.id] = el.innerText.trim();
    });
    localStorage.setItem('bingoSeatsOnlyV2', JSON.stringify(data));
  }

  function loadFromStorage() {
    const saved = localStorage.getItem('bingoSeatsOnlyV2');
    if (!saved) return;
    const data = JSON.parse(saved);
    document.querySelectorAll('[contenteditable="true"]').forEach(el => {
      if (data[el.dataset.id] !== undefined) {
        el.innerText = data[el.dataset.id];
      }
    });
  }

  function exportData() {
    saveToStorage();
    const data = localStorage.getItem('bingoSeatsOnlyV2') || '{}';
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'bingo-seating-backup.json';
    a.click();
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      localStorage.setItem('bingoSeatsOnlyV2', e.target.result);
      loadFromStorage();
      alert('Seating chart loaded!');
    };
    reader.readAsText(file);
  }

  function resetChart() {
    if (confirm('Clear all names from every seat?')) {
      localStorage.removeItem('bingoSeatsOnlyV2');
      initChart();
    }
  }

  initChart();
</script>
</body>
</html>
