<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo Designated Seats</title>
<style>
  :root {
    --primary-blue: #1b365d;
    --accent-gold: #f4b41a;
    --walkway-bg: #e2e8f0;
    --seat-bg: #dbeafe;
    --seat-border: #2563eb;
    --table-bg: #f8fafc;
  }

  * {
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    background-color: #f1f5f9;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Control Bar - Hidden when printing */
  .controls {
    background: white;
    padding: 12px 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    margin-bottom: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    max-width: 1000px;
    width: 100%;
  }

  .controls span {
    font-size: 14px;
    color: #475569;
    margin-right: auto;
  }

  button {
    background-color: var(--primary-blue);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    transition: background 0.2s;
  }

  button:hover {
    background-color: #2c5282;
  }

  button.secondary {
    background-color: #64748b;
  }

  button.secondary:hover {
    background-color: #475569;
  }

  button.danger {
    background-color: #dc2626;
  }

  button.danger:hover {
    background-color: #b91c1c;
  }

  /* Main Printable Chart */
  .chart-container {
    background: white;
    width: 100%;
    max-width: 1050px;
    padding: 24px;
    border: 4px solid var(--primary-blue);
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }

  .header {
    text-align: center;
    background: var(--primary-blue);
    color: white;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 18px;
  }

  .header h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--accent-gold);
  }

  .header p {
    margin: 4px 0 0;
    font-size: 14px;
    letter-spacing: 1px;
    font-weight: bold;
  }

  /* Stage and Kitchen Row */
  .landmarks {
    display: grid;
    grid-template-columns: 1fr 110px 1fr;
    gap: 16px;
    margin-bottom: 18px;
  }

  .landmark-box {
    background: #fef3c7;
    border: 3px dashed #d97706;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
    font-weight: 800;
    font-size: 18px;
    color: #92400e;
    letter-spacing: 1.5px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Room Layout Grid */
  .room-grid {
    display: grid;
    grid-template-columns: 1fr 110px 1fr;
    gap: 16px;
    align-items: stretch;
  }

  .side-section {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px 12px;
  }

  /* Center Walkway */
  .walkway {
    background: var(--walkway-bg);
    border: 2px solid #94a3b8;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 30px 10px;
    font-weight: 800;
    color: #334155;
    text-align: center;
    font-size: 16px;
    letter-spacing: 1px;
  }

  .arrow {
    font-size: 32px;
    line-height: 1;
  }

  /* Individual Table + Seats */
  .table-unit {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .seats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }

  .seat {
    background: var(--seat-bg);
    border: 1.5px solid var(--seat-border);
    border-radius: 5px;
    min-height: 30px;
    padding: 3px;
    font-size: 11px;
    font-weight: 600;
    color: #1e3a8a;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    word-break: break-word;
    cursor: text;
    transition: background 0.15s;
  }

  .seat:hover, .table-center:hover {
    background: #fef9c3;
    outline: 2px solid #eab308;
  }

  .seat:empty::before {
    content: "Seat";
    color: #93c5fd;
    font-weight: 400;
    font-size: 10px;
  }

  .table-center {
    background: var(--table-bg);
    border: 2.5px solid var(--primary-blue);
    border-radius: 6px;
    padding: 8px 4px;
    text-align: center;
    min-height: 54px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    cursor: text;
  }

  .table-num {
    font-size: 11px;
    font-weight: 800;
    color: #64748b;
    text-transform: uppercase;
  }

  .table-group {
    font-size: 14px;
    font-weight: 700;
    color: #0f172a;
    margin-top: 2px;
  }

  /* Print Formatting */
  @media print {
    body {
      background: white;
      padding: 0;
    }
    .controls {
      display: none !important;
    }
    .chart-container {
      box-shadow: none;
      border: 3px solid var(--primary-blue);
      max-width: 100%;
      padding: 15px;
    }
    .seat:empty::before {
      content: "";
    }
    @page {
      size: landscape;
      margin: 0.4in;
    }
  }
</style>
</head>
<body>

  <!-- Toolbar for Non-Programmers -->
  <div class="controls">
    <span>✏️ <strong>Click any box or seat</strong> to type a name. Changes save automatically!</span>
    <button onclick="window.print()">🖨️ Print Chart</button>
    <button class="secondary" onclick="exportData()">💾 Save Backup</button>
    <button class="secondary" onclick="document.getElementById('fileInput').click()">📂 Load Backup</button>
    <button class="danger" onclick="resetChart()">🔄 Reset Default</button>
    <input type="file" id="fileInput" accept=".json" style="display:none" onchange="importData(event)">
  </div>

  <!-- Printable Seating Chart -->
  <div class="chart-container">
    <div class="header">
      <h1>BINGO</h1>
      <p>DESIGNATED SEATS</p>
    </div>

    <!-- Top Landmarks: Stage near Amy Houser (Left), Kitchen near Bobby (Right) -->
    <div class="landmarks">
      <div class="landmark-box" contenteditable="true" data-id="landmark-left">🎤 STAGE</div>
      <div></div>
      <div class="landmark-box" contenteditable="true" data-id="landmark-right">🍽️ KITCHEN</div>
    </div>

    <div class="room-grid">
      <!-- LEFT SIDE TABLES (Flipped so 7, 8, 9 are at the top by the Stage) -->
      <div class="side-section" id="left-tables"></div>

      <!-- CENTER WALKWAY -->
      <div class="walkway">
        <div class="arrow">↑</div>
        <div>WALK<br>WAY</div>
        <div class="arrow">↓</div>
      </div>

      <!-- RIGHT SIDE TABLES (Flipped so 18, 17, 16 are at the top by the Kitchen) -->
      <div class="side-section" id="right-tables"></div>
    </div>
  </div>

<script>
  // =========================================================================
  // EASY DEFAULT CONFIGURATION (If someone wants to edit defaults in code)
  // =========================================================================
  const defaultTables = {
    left: [
      { num: "Table 7", group: "Amy Houser" },
      { num: "Table 8", group: "Bond" },
      { num: "Table 9", group: "Knode" },
      { num: "Table 4", group: "Debbie" },
      { num: "Table 5", group: "" },
      { num: "Table 6", group: "Wanda Reeder" },
      { num: "Table 1", group: "Rachel Myers" },
      { num: "Table 2", group: "Michael" },
      { num: "Table 3", group: "Nalley" }
    ],
    right: [
      { num: "Table 18", group: "Bobby" },
      { num: "Table 17", group: "" },
      { num: "Table 16", group: "" },
      { num: "Table 15", group: "Sheri" },
      { num: "Table 14", group: "" },
      { num: "Table 13", group: "" },
      { num: "Table 12", group: "Jamison" },
      { num: "Table 11", group: "Jamison" },
      { num: "Table 10", group: "Ladygo" }
    ]
  };

  // Build a single table with 3 top seats and 3 bottom seats
  function createTableHTML(table, side, index) {
    const baseId = `${side}-${index}`;
    return `
      <div class="table-unit">
        <div class="seats-row">
          <div class="seat" contenteditable="true" data-id="${baseId}-s1"></div>
          <div class="seat" contenteditable="true" data-id="${baseId}-s2"></div>
          <div class="seat" contenteditable="true" data-id="${baseId}-s3"></div>
        </div>
        <div class="table-center">
          <div class="table-num" contenteditable="true" data-id="${baseId}-num">${table.num}</div>
          <div class="table-group" contenteditable="true" data-id="${baseId}-group">${table.group}</div>
        </div>
        <div class="seats-row">
          <div class="seat" contenteditable="true" data-id="${baseId}-s4"></div>
          <div class="seat" contenteditable="true" data-id="${baseId}-s5"></div>
          <div class="seat" contenteditable="true" data-id="${baseId}-s6"></div>
        </div>
      </div>
    `;
  }

  // Render the room
  function initChart() {
    const leftContainer = document.getElementById('left-tables');
    const rightContainer = document.getElementById('right-tables');

    leftContainer.innerHTML = defaultTables.left.map((t, i) => createTableHTML(t, 'left', i)).join('');
    rightContainer.innerHTML = defaultTables.right.map((t, i) => createTableHTML(t, 'right', i)).join('');

    loadFromStorage();

    // Auto-save whenever anyone types in any box
    document.querySelectorAll('[contenteditable="true"]').forEach(el => {
      el.addEventListener('input', saveToStorage);
    });
  }

  // Save all text to browser memory
  function saveToStorage() {
    const data = {};
    document.querySelectorAll('[contenteditable="true"]').forEach(el => {
      data[el.dataset.id] = el.innerText.trim();
    });
    localStorage.setItem('bingoSeatingChart', JSON.stringify(data));
  }

  // Load saved names from browser memory
  function loadFromStorage() {
    const saved = localStorage.getItem('bingoSeatingChart');
    if (!saved) return;
    const data = JSON.parse(saved);
    document.querySelectorAll('[contenteditable="true"]').forEach(el => {
      if (data[el.dataset.id] !== undefined) {
        el.innerText = data[el.dataset.id];
      }
    });
  }

  // Download a JSON backup file to send to other volunteers
  function exportData() {
    saveToStorage();
    const data = localStorage.getItem('bingoSeatingChart');
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'bingo-seating-backup.json';
    a.click();
  }

  // Load a JSON backup file
  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      localStorage.setItem('bingoSeatingChart', e.target.result);
      loadFromStorage();
      alert('Seating chart loaded!');
    };
    reader.readAsText(file);
  }

  // Clear edits and restore original layout
  function resetChart() {
    if (confirm('Are you sure you want to clear all typed names and reset to the original chart?')) {
      localStorage.removeItem('bingoSeatingChart');
      initChart();
    }
  }

  initChart();
</script>
</body>
</html>
